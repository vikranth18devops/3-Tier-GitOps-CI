name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
################################################################################
# Compile
################################################################################
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            api/package-lock.json

      - name: Frontend Syntax Check
        run: |
          cd client
          find . -name "*.js" -exec node --check {} +

      - name: Backend Syntax Check
        run: |
          cd api
          find . -name "*.js" -exec node --check {} +

################################################################################
# Gitleaks
################################################################################
  gitleaks_scan:
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Scan Frontend
        run: gitleaks detect --source ./client --exit-code 1

      - name: Scan Backend
        run: gitleaks detect --source ./api --exit-code 1

################################################################################
# Trivy Filesystem Scan
################################################################################
  trivy_fs_scan:
    runs-on: ubuntu-latest
    needs: gitleaks_scan

    steps:
      - uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          

################################################################################
# Backend Docker Build
################################################################################
  build_backend:
    runs-on: ubuntu-latest
    needs: trivy_fs_scan

    steps:
      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            adijaiswal/backend:latest
            adijaiswal/backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

################################################################################
# Frontend Docker Build
################################################################################
  build_frontend:
    runs-on: ubuntu-latest
    needs: trivy_fs_scan

    steps:
      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            vikranthdevops18/frontend:latest
            vikranthdevops18/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

################################################################################
# Trivy Image Scan
################################################################################
  trivy_image_scan:
    runs-on: ubuntu-latest

    needs:
      - build_backend
      - build_frontend

    steps:
      - uses: actions/checkout@v4

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vikranthdevops18/backend:${{ env.IMAGE_TAG }}
          scan-type: image
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vikranthdevops18/frontend:${{ env.IMAGE_TAG }}
          scan-type: image
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library

################################################################################
# GitOps CD Update
################################################################################
  update_cd_repo:
    runs-on: ubuntu-latest
    needs: trivy_image_scan

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: vikranthdevops18/3-Tier-GitOps-CD
          token: ${{ secrets.CD_REPO_TOKEN }}
          ref: main
          path: cd

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
          https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Kubernetes Manifests
        working-directory: cd
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |

          yq -i '
            (. | select(.kind=="Deployment")
               | .spec.template.spec.containers[]
               | select(.name=="backend")
            | .image)
            = "vikranthdevops18/backend:" + strenv(IMAGE_TAG)
          ' k8s-prod/backend.yaml

          yq -i '
            (. | select(.kind=="Deployment")
            | .spec.template.spec.containers[]
            | select(.name=="frontend")
            | .image)
            = "vikranthdevops18/frontend:" + strenv(IMAGE_TAG)
          ' k8s-prod/frontend.yaml

      - name: Commit Changes
        working-directory: cd
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Update image tag to ${IMAGE_TAG}" || echo "No Changes"

          git push